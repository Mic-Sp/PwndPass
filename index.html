<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PwndPass</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="terminal-card" aria-labelledby="app-title">
        <header class="terminal-card__header">
          <div>
            <p class="terminal-card__eyebrow">SECURITY TOOL / 01</p>
            <h1 id="app-title">PwndPass</h1>
          </div>
          <p class="terminal-card__status"><span aria-hidden="true"></span> RANGE SCAN</p>
        </header>

        <div class="terminal-card__body">
          <form id="password-form" class="password-form">
            <label class="password-form__label" for="password">Password</label>
            <div class="password-form__field">
              <span class="password-form__prompt" aria-hidden="true">&gt;_</span>
              <input class="password-form__input" id="password" name="password" type="password" required autocomplete="off">
              <button class="password-form__toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg class="password-form__eye password-form__eye--open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="password-form__eye password-form__eye--closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                  <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.1-.8"></path>
                </svg>
              </button>
            </div>
            <button class="password-form__submit" type="submit">
              <span>Run breach check</span>
              <span aria-hidden="true">[ ENTER ]</span>
            </button>
          </form>

          <section class="result-panel" aria-labelledby="result-heading">
            <div class="result-panel__header">
              <h2 id="result-heading">Output</h2>
              <span class="result-panel__indicator" aria-hidden="true"></span>
            </div>
            <p id="result" class="result" role="status" aria-live="polite"></p>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
